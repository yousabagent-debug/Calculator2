<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#1c1c1e;font-family:sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));user-select:none}
#disp{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;direction:ltr;padding:12px 8px;overflow:hidden}
#ex{color:#9a9a9f;font-size:1.5rem;min-height:2rem;word-break:break-all;text-align:right}
#big{color:#fff;font-size:4rem;line-height:1.1;word-break:break-all;text-align:right}
.grid{height:62%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:10px;direction:ltr}
button{font-size:1.7rem;border:0;border-radius:22px;background:#333336;color:#fff;font-family:inherit}
button:active{filter:brightness(1.5)}
button.fn{background:#4d4d52}
button.op{background:#ff9500}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1e">
</head>
<body>
<div id="disp"><div id="ex"></div><div id="big">0</div></div>
<div class="grid" id="g">
<button class="fn" data-k="(">(</button>
<button class="fn" data-k=")">)</button>
<button class="fn" data-k="rt">√</button>
<button class="fn" data-k="sq">x²</button>
<button class="fn" data-k="C">C</button>
<button class="fn" data-k="neg">±</button>
<button class="fn" data-k="%">%</button>
<button class="op" data-k="÷">÷</button>
<button data-k="7">7</button>
<button data-k="8">8</button>
<button data-k="9">9</button>
<button class="op" data-k="×">×</button>
<button data-k="4">4</button>
<button data-k="5">5</button>
<button data-k="6">6</button>
<button class="op" data-k="−">−</button>
<button data-k="1">1</button>
<button data-k="2">2</button>
<button data-k="3">3</button>
<button class="op" data-k="+">+</button>
<button data-k="0">0</button>
<button data-k=".">.</button>
<button data-k="del">⌫</button>
<button class="op" data-k="=">=</button>
</div>
<script>
const $=id=>document.getElementById(id);
let expr='',done=false,hist='',pv='0';
const OPS='+−×÷';
const fmt=s=>s.replace(/\d+(\.\d*)?/g,m=>{const p=m.split('.');return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p.length>1?'.'+p[1]:'')});
function ev(s){
  const o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;
  s+=')'.repeat(Math.max(o,0));
  if(!/^[0-9+−×÷().%√^\s]+$/.test(s))throw 0;
  let j=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,' - ').replace(/\+/g,' + ').replace(/%/g,'/100').replace(/\^/g,'**').replace(/√\(/g,'Math.sqrt(');
  if(/^\s*-/.test(j))j='0'+j;
  const r=Function('"use strict";return ('+j+')')();
  if(!isFinite(r))throw 0;
  return parseFloat(r.toPrecision(12));
}
function render(){
  $('ex').textContent=done?hist:fmt(expr);
  if(!expr){pv='0'}
  else if(!done){
    if(/^[\d.]+$/.test(expr)){pv=fmt(expr)}
    else if(/[0-9)%]$/.test(expr)){try{pv=fmt(String(ev(expr)).replace('-','−'))}catch(e){}}
  }
  const b=$('big');
  b.textContent=pv;
  b.style.fontSize=pv.length>14?'2rem':pv.length>10?'2.6rem':pv.length>7?'3.3rem':'4rem';
}
function press(k){
  const val=/[0-9)%]$/.test(expr);
  const start=()=>{if(done){expr='';hist='';done=false}};
  if(/^[0-9]$/.test(k)){start();if(/[)%]$/.test(expr))expr+='×';expr+=k}
  else if(k==='.'){start();if(/[)%]$/.test(expr))expr+='×';const m=expr.match(/[\d.]*$/)[0];if(m.includes('.'))return;expr+=m===''?'0.':'.'}
  else if(OPS.includes(k)){
    done=false;
    if(expr===''){if(k==='−')expr='−';render();return}
    if(expr==='−'||expr.slice(-1)==='(')return;
    if(OPS.includes(expr.slice(-1)))expr=expr.slice(0,-1);
    expr+=k;
  }
  else if(k==='('){start();if(val)expr+='×';expr+='('}
  else if(k===')'){const o=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;if(o>0&&val)expr+=')'}
  else if(k==='rt'){start();if(val)expr+='×';expr+='√('}
  else if(k==='sq'){done=false;if(/[0-9)]$/.test(expr))expr+='^2'}
  else if(k==='%'){done=false;if(/[0-9)]$/.test(expr))expr+='%'}
  else if(k==='neg'){
    done=false;
    const m=expr.match(/\(−(\d+\.?\d*)\)$/);
    if(m)expr=expr.slice(0,m.index)+m[1];
    else{const n=expr.match(/(\d+\.?\d*)$/);if(n)expr=expr.slice(0,n.index)+'(−'+n[1]+')'}
  }
  else if(k==='C'){expr='';hist='';done=false;pv='0'}
  else if(k==='del'){
    if(done){expr='';hist='';done=false}
    else if(expr.endsWith('√(')||expr.endsWith('^2'))expr=expr.slice(0,-2);
    else expr=expr.slice(0,-1);
  }
  else if(k==='='){
    if(!expr||done)return;
    try{
      const r=String(ev(expr)).replace('-','−');
      if(/e/.test(r))throw 0;
      hist=fmt(expr)+' =';expr=r;pv=fmt(r);done=true;
    }catch(e){expr='';hist='';done=false;render();$('big').textContent='خطأ';pv='0';return}
  }
  render();
}
$('g').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(navigator.vibrate)navigator.vibrate(12);
  press(b.dataset.k);
});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
